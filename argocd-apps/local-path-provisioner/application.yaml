apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: local-path-provisioner
  namespace: argocd
spec:
  project: default
  
  source:
    repoURL: 'https://github.com/IagodaSergei/argotests.git' 
    targetRevision: main
    path: charts/local-path-provisioner
    
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: local-path-storage 
    
  syncPolicy:
    automated:
      prune: true    # Deletes resources if they are removed from Git
      selfHeal: true # Re-applies resources if they are manually changed in the cluster
    syncOptions:
      - CreateNamespace=true 
      - ServerSideApply=true
